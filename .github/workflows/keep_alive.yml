name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to prevent Streamlit Community Cloud from sleeping
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit Cloud Application
        run: |
          curl -I -s -L "https://sales-dashboard-gepexnacdzs7bvtfpfmo26.streamlit.app/" || true
          echo "Streamlit app pinged successfully."
